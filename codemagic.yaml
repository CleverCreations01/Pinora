workflows:
  pinvora-android:
    name: PINVORA Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Verify remote website configuration
        script: |
          node -e "const c=require('./capacitor.config.json'); if(c.server?.url !== 'https://pinora-six.vercel.app') { console.error('PINVORA must load the stable production website URL'); process.exit(1); } console.log('Remote website:', c.server.url)"
      - name: Build the web app
        script: npm run build
      - name: Create Android project
        script: npx cap add android
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Verify remote URL was copied into Android app
        script: |
          node -e "const fs=require('fs'); const p='android/app/src/main/assets/capacitor.config.json'; if(!fs.existsSync(p)) { console.error('Capacitor config was not generated'); process.exit(1); } const c=JSON.parse(fs.readFileSync(p,'utf8')); if(c.server?.url !== 'https://pinora-six.vercel.app') { console.error('Android build is not configured to load the live PINVORA website'); process.exit(1); } console.log('Android app will load:', c.server.url)"
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Apply PINVORA launcher icon
        script: |
          brew list librsvg >/dev/null 2>&1 || brew install librsvg
          for entry in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $entry
            density="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" public/icon.svg > "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK artifact verified"
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
